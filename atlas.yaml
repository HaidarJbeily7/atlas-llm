# ATLAS Configuration Example
# See README.md for documentation

provider:
  model: openrouter/openai/gpt-4o-mini
  api_key: ${OPENROUTER_API_KEY}
  timeout: 30
  max_retries: 3
  temperature: 0.0

scan:
  concurrency: 10
  timeout: 600
  probe_timeout: 120
  continue_on_error: false
  checkpoint_enabled: true
  checkpoint_dir: .atlas/checkpoints

output:
  directory: ./results
  format: json
  include_timestamps: true
  include_evidence: true

compliance:
  eu_ai_act: true
  owasp_llm: true
  risk_threshold: 0.7
  strict_mode: false

logging:
  level: INFO
  format: console
  output: stdout
