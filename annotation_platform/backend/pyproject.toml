[project]
name = "atlas-backend"
version = "0.1.0"
description = "Investigation & annotation API for ATLAS experiment results"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.scripts]
atlas-backend = "atlas_backend.app:run"
atlas-backend-seed = "atlas_backend.cli:seed_main"
atlas-backend-experiments = "atlas_backend.cli:list_experiments_main"
atlas-backend-adduser = "atlas_backend.cli:adduser_main"
atlas-backend-delete-model = "atlas_backend.cli:delete_model_data_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
