app = "atlas-annotation"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ATLAS_HOST = "0.0.0.0"
  ATLAS_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[http_service.concurrency]
  type = "requests"
  hard_limit = 250
  soft_limit = 200

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
